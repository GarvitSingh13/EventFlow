global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "eventflow-backend"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 2s
    static_configs:
      - targets: ["host.docker.internal:8085"]
        labels:
          application: "eventflow"
          environment: "production"
